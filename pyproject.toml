[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redact-pii"
version = "0.1.0"
description = "Detect and redact personal data with validators that suppress false positives."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["pii", "redaction", "privacy", "gdpr", "logging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/redact-pii"

[project.scripts]
redact-pii = "redactpii.cli:main"

[tool.setuptools.packages.find]
include = ["redactpii*"]
